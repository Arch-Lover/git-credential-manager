
name: Check upstream versions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    name: Check and prepare upstream update
    runs-on: ubuntu-latest

    steps:
      - name: Check out package recipe
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare packaged and upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          current="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n 1)"

          latest="$(
            curl \
              --fail \
              --location \
              --retry 3 \
              --silent \
              --show-error \
              https://api.github.com/repos/git-ecosystem/git-credential-manager/releases/latest |
              jq --exit-status --raw-output '.tag_name | ltrimstr("v")'
          )"

          version_pattern='^[0-9]+(\.[0-9]+){2,3}$'

          [[ "$current" =~ $version_pattern ]] || {
            echo "Invalid current pkgver: $current" >&2
            exit 1
          }

          [[ "$latest" =~ $version_pattern ]] || {
            echo "Invalid upstream version: $latest" >&2
            exit 1
          }

          {
            echo "current=$current"
            echo "latest=$latest"

            if [[ "$current" != "$latest" ]]; then
              echo "updates_available=true"
            else
              echo "updates_available=false"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "Packaged version: $current"
          echo "Upstream version: $latest"

      - name: Update version and release number
        if: steps.versions.outputs.updates_available == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          sed -i -E \
            -e "s/^pkgver=.*/pkgver=$LATEST/" \
            -e 's/^pkgrel=.*/pkgrel=1/' \
            PKGBUILD

      - name: Regenerate checksums and package metadata
        if: steps.versions.outputs.updates_available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/package-metadata"
          mkdir -p "$output_dir"

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$output_dir:/out" \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel pacman-contrib

              useradd --create-home builder
              install -d -o builder -g builder /build

              cp -a /source/. /build/
              chown -R builder:builder /build

              runuser -u builder -- \
                bash -euo pipefail -c "
                  cd /build

                  # Update the existing checksum arrays in PKGBUILD.
                  updpkgsums

                  # Verify the downloaded sources against the new checksums.
                  makepkg --verifysource

                  # Generate metadata from the updated recipe.
                  makepkg --printsrcinfo > .SRCINFO
                "

              cp /build/PKGBUILD /out/PKGBUILD
              cp /build/.SRCINFO /out/.SRCINFO
            '

          # Copy generated files back out of the container.
          cp "$output_dir/PKGBUILD" "$GITHUB_WORKSPACE/PKGBUILD"
          cp "$output_dir/.SRCINFO" "$GITHUB_WORKSPACE/.SRCINFO"

          echo "Updated PKGBUILD:"
          grep -E '^(pkgver|pkgrel|sha[0-9]+sums)=' PKGBUILD || true

          echo "Updated .SRCINFO:"
          grep -E '^[[:space:]]*(pkgver|pkgrel)[[:space:]]' .SRCINFO

      - name: Validate package metadata
        if: steps.versions.outputs.updates_available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/package-validation"
          mkdir -p "$output_dir"

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$output_dir:/out" \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel pacman-contrib

              useradd --create-home builder
              install -d -o builder -g builder /build

              cp -a /source/. /build/
              chown -R builder:builder /build

              runuser -u builder -- \
                bash -euo pipefail -c "
                  cd /build
                  makepkg --verifysource
                  makepkg --printsrcinfo > /out/.SRCINFO
                "
            '

          # Ensure the checked-in metadata matches the generated metadata.
          if ! cmp -s .SRCINFO "$output_dir/.SRCINFO"; then
            echo "Committed .SRCINFO differs from generated metadata." >&2
            diff -u .SRCINFO "$output_dir/.SRCINFO" || true
            exit 1
          fi

      - name: Create or update upstream pull request
        if: steps.versions.outputs.updates_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/upstream-${LATEST}"
          saved_dir="$RUNNER_TEMP/updated-package"
          mkdir -p "$saved_dir"

          # Preserve the generated files before switching branches.
          cp PKGBUILD .SRCINFO "$saved_dir/"

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin

          # Discard only the local working-tree changes after saving them.
          git reset --hard HEAD

          # Reuse an existing remote branch when one exists.
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch" origin/main
          fi

          cp "$saved_dir/PKGBUILD" "$saved_dir/.SRCINFO" .

          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "No additional changes to commit on $branch."
          else
            git commit \
              -m "Update git-credential-manager to $LATEST"

            git push origin "HEAD:refs/heads/$branch"
          fi

          existing_pr="$(
            gh pr list \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing pull request #$existing_pr."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update git-credential-manager to $LATEST" \
            --body "$(cat <<EOF
          Automated upstream update.

          Upstream release: v${LATEST}

          Changes:
          - Updated pkgver
          - Reset pkgrel to 1
          - Regenerated checksums using updpkgsums
          - Verified upstream source files
          - Regenerated and validated .SRCINFO

          Please review the package changes before merging.
          EOF
          )"
