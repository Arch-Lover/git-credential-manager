name: Check upstream versions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    name: Check and prepare upstream update
    runs-on: ubuntu-latest

    steps:
      - name: Check out package recipe
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare packaged and upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          current="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n 1)"

          latest="$(
            curl \
              --fail \
              --location \
              --retry 3 \
              --silent \
              --show-error \
              https://api.github.com/repos/git-ecosystem/git-credential-manager/releases/latest |
              jq --exit-status --raw-output '.tag_name | ltrimstr("v")'
          )"

          version_pattern='^[0-9]+(\.[0-9]+){2,3}$'

          [[ "$current" =~ $version_pattern ]] || {
            echo "Invalid current pkgver: $current" >&2
            exit 1
          }

          [[ "$latest" =~ $version_pattern ]] || {
            echo "Invalid upstream version: $latest" >&2
            exit 1
          }

          {
            echo "current=$current"
            echo "latest=$latest"

            if [[ "$current" != "$latest" ]]; then
              echo "updates_available=true"
            else
              echo "updates_available=false"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "Packaged version: $current"
          echo "Upstream version: $latest"

      - name: Generate updated recipe, checksums, and metadata
        if: steps.versions.outputs.updates_available == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/package-metadata"
          mkdir -p "$output_dir"

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$output_dir:/out" \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel pacman-contrib

              useradd --create-home builder
              install -d -o builder -g builder /build

              cp -a /source/. /build/
              chown -R builder:builder /build

              # Set the requested version and reset pkgrel.
              sed -i \
                -e "s/^pkgver=.*/pkgver='"$LATEST"'/" \
                -e "s/^pkgrel=.*/pkgrel=1/" \
                /build/PKGBUILD

              runuser -u builder -- \
                bash -euo pipefail -c "
                  cd /build

                  updpkgsums
                  makepkg --verifysource
                  makepkg --printsrcinfo > .SRCINFO
                "

              # Copy as root so builder does not need write access to /out.
              cp /build/PKGBUILD /out/PKGBUILD
              cp /build/.SRCINFO /out/.SRCINFO
            '

          cp "$output_dir/PKGBUILD" "$GITHUB_WORKSPACE/PKGBUILD"
          cp "$output_dir/.SRCINFO" "$GITHUB_WORKSPACE/.SRCINFO"

          echo "Generated metadata:"
          grep -E '^[[:space:]]*(pkgver|pkgrel)[[:space:]]' .SRCINFO

      - name: Validate generated metadata
        if: steps.versions.outputs.updates_available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/metadata-validation"
          mkdir -p "$output_dir"

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$output_dir:/out" \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel

              useradd --create-home builder
              install -d -o builder -g builder /build

              cp -a /source/. /build/
              chown -R builder:builder /build

              # Generate the metadata as the unprivileged builder.
              # The output file is inside /build, which builder owns.
              runuser -u builder -- \
                bash -euo pipefail -c "
                  cd /build
                  makepkg --printsrcinfo > .SRCINFO
                "

              # Copy the result as root to avoid /out permission errors.
              cp /build/.SRCINFO /out/.SRCINFO
            '

          if ! cmp -s .SRCINFO "$output_dir/.SRCINFO"; then
            echo "Generated .SRCINFO does not match the recipe." >&2
            diff -u .SRCINFO "$output_dir/.SRCINFO" || true
            exit 1
          fi

          echo "Generated .SRCINFO matches the PKGBUILD."

      - name: Create or update pull request
        if: steps.versions.outputs.updates_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/upstream-${LATEST}"
          saved_dir="$RUNNER_TEMP/updated-package"
          mkdir -p "$saved_dir"

          cp PKGBUILD .SRCINFO "$saved_dir/"

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin

          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch" origin/main
          fi

          cp "$saved_dir/PKGBUILD" "$saved_dir/.SRCINFO" .

          git add PKGBUILD .SRCINFO

          if ! git diff --cached --quiet; then
            git commit -m "Update git-credential-manager to $LATEST"
            git push origin "HEAD:refs/heads/$branch"
          else
            echo "The update branch already contains these changes."
          fi

          existing_pr="$(
            gh pr list \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            echo "Pull request #$existing_pr is already open."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update git-credential-manager to $LATEST" \
            --body "Automated upstream update to v${LATEST}.

          - Updated pkgver and reset pkgrel.
          - Regenerated source checksums.
          - Verified source files.
          - Regenerated and validated .SRCINFO.

          Please review before merging."
