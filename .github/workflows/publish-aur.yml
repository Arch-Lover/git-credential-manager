
name: Publish to AUR

on:
  push:
    branches:
      - main
    paths:
      - PKGBUILD
      - .SRCINFO
      - .github/workflows/aur-publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish package recipe to AUR
    runs-on: ubuntu-latest

    env:
      AUR_PACKAGE: git-credential-manager
      AUR_GIT_NAME: GitHub Actions
      AUR_GIT_EMAIL: actions@users.noreply.github.com
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Validate package sources
        shell: bash
        run: |
          set -euo pipefail

          for file in PKGBUILD .SRCINFO; do
            if [[ ! -f "$file" ]]; then
              echo "Required package source file is missing: $file" >&2
              exit 1
            fi
          done

      - name: Check AUR credentials
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo "Missing required AUR_SSH_KEY GitHub secret." >&2
            exit 1
          fi

      - name: Configure SSH for the AUR
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          # Normalize CRLF line endings in the GitHub secret.
          printf '%s' "$AUR_SSH_KEY" |
            tr -d '\r' > ~/.ssh/aur_key
          printf '\n' >> ~/.ssh/aur_key

          chmod 600 ~/.ssh/aur_key

          ssh-keygen -y -f ~/.ssh/aur_key > /dev/null || {
            echo "AUR_SSH_KEY is not a valid OpenSSH private key." >&2
            exit 1
          }

          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes"

          # Persist SSH configuration for subsequent workflow steps.
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >> "$GITHUB_ENV"

      - name: Update the AUR repository
        shell: bash
        run: |
          set -euo pipefail

          aur_dir="$RUNNER_TEMP/aur-repository"

          git clone \
            "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" \
            "$aur_dir"

          # Replace only the package files, preserving Git metadata.
          cp PKGBUILD .SRCINFO "$aur_dir/"

          cd "$aur_dir"

          git config user.name "$AUR_GIT_NAME"
          git config user.email "$AUR_GIT_EMAIL"

          git add PKGBUILD .SRCINFO

          # Check the staged changes, not the working tree.
          if git diff --cached --quiet; then
            echo "AUR already contains these package sources; nothing to publish."
            exit 0
          fi

          version="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n 1)"
          release="$(sed -n 's/^pkgrel=//p' PKGBUILD | head -n 1)"

          if [[ -z "$version" || -z "$release" ]]; then
            echo "Could not determine pkgver or pkgrel from PKGBUILD." >&2
            exit 1
          fi

          git commit \
            -m "Update git-credential-manager to ${version}-${release}"

          git push origin HEAD:master
