
name: Build and publish AUR package

on:
  push:
    branches:
      - main
    paths:
      - PKGBUILD
      - .SRCINFO
      - .github/workflows/aur-publish.yml

  pull_request:
    branches:
      - main
    paths:
      - PKGBUILD
      - .SRCINFO
      - .github/workflows/aur-publish.yml

  workflow_dispatch:
    inputs:
      publish:
        description: Publish the successfully built package recipe to the AUR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Validate and build in Arch Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out package
        uses: actions/checkout@v6

      - name: Build package and generate fresh metadata
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/package-output"
          mkdir -p "$output_dir"

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$output_dir:/out" \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel git sudo

              useradd --create-home builder

              printf "builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n" \
                > /etc/sudoers.d/builder
              chmod 440 /etc/sudoers.d/builder

              install -d -o builder -g builder /build
              cp -a /source/. /build/
              chown -R builder:builder /build

              runuser -u builder -- \
                bash -euo pipefail -c "
                  cd /build

                  # Generate metadata instead of trusting a possibly stale file.
                  makepkg --printsrcinfo > .SRCINFO

                  # Build and install missing dependencies.
                  makepkg --syncdeps --noconfirm --cleanbuild
                "

              mkdir -p /out/aur

              cp /build/PKGBUILD /build/.SRCINFO /out/aur/

              find /build \
                -maxdepth 1 \
                -type f \
                -name "*.pkg.tar.*" \
                ! -name "*.sig" \
                -exec cp {} /out/ \;

              if ! compgen -G "/out/*.pkg.tar.*" > /dev/null; then
                echo "No package archive was produced." >&2
                exit 1
              fi
            '

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: git-credential-manager-package
          path: ${{ runner.temp }}/package-output/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated AUR sources
        uses: actions/upload-artifact@v4
        with:
          name: aur-source-bundle
          path: ${{ runner.temp }}/package-output/aur/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-aur:
    name: Publish package recipe to AUR
    needs: build

    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)

    runs-on: ubuntu-latest
    environment: aur-production

    env:
      AUR_PACKAGE: git-credential-manager
      AUR_GIT_NAME: GitHub Actions
      AUR_GIT_EMAIL: actions@users.noreply.github.com
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_KEY }}

    steps:
      - name: Check AUR credentials
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "Missing required AUR_SSH_KEY secret." >&2
            exit 1
          fi

      - name: Download generated AUR sources
        uses: actions/download-artifact@v4
        with:
          name: aur-source-bundle
          path: aur-source-bundle

      - name: Configure SSH for the AUR
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          printf '%s' "$AUR_SSH_PRIVATE_KEY" |
            tr -d '\r' > ~/.ssh/aur_key
          printf '\n' >> ~/.ssh/aur_key

          chmod 600 ~/.ssh/aur_key

          ssh-keygen -y -f ~/.ssh/aur_key > /dev/null || {
            echo "AUR_SSH_KEY is not a valid OpenSSH private key." >&2
            exit 1
          }

          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur_key -o IdentitiesOnly=yes" \
            >> "$GITHUB_ENV"

      - name: Update the AUR repository
        shell: bash
        run: |
          set -euo pipefail

          aur_dir="$RUNNER_TEMP/aur-repository"

          git clone \
            "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" \
            "$aur_dir"

          # Preserve .git while replacing the tracked recipe files.
          find "$aur_dir" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name .git \
            -exec rm -rf {} +

          cp \
            aur-source-bundle/PKGBUILD \
            aur-source-bundle/.SRCINFO \
            "$aur_dir/"

          cd "$aur_dir"

          git config user.name "$AUR_GIT_NAME"
          git config user.email "$AUR_GIT_EMAIL"

          git add -A

          if git diff --cached --quiet; then
            echo "AUR already contains these package sources; nothing to publish."
            exit 0
          fi

          version="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n 1)"
          release="$(sed -n 's/^pkgrel=//p' PKGBUILD | head -n 1)"

          if [[ -z "$version" || -z "$release" ]]; then
            echo "Could not determine pkgver or pkgrel." >&2
            exit 1
          fi

          git commit -m "Update to ${version}-${release}"
          git push origin HEAD:master
